function bigramTokenize(text) {
  if (text == null) return [];
  var s = String(text).toLowerCase();
  var tokens = [];
  var i = 0;
  var n = s.length;
  // CJK range: ぀-ヿ (hira/kata), 㐀-鿿 (kanji), ＀-ﾟ (fullwidth)
  function isCJK(ch) {
    var c = ch.charCodeAt(0);
    return (c >= 0x3040 && c <= 0x30ff) ||
           (c >= 0x3400 && c <= 0x9fff) ||
           (c >= 0xff00 && c <= 0xff9f);
  }
  function isWord(ch) {
    return /[0-9a-z]/.test(ch);
  }
  while (i < n) {
    var ch = s[i];
    if (isCJK(ch)) {
      // take the longest contiguous CJK run
      var j = i;
      while (j < n && isCJK(s[j])) j++;
      var run = s.slice(i, j);
      if (run.length === 1) {
        tokens.push(run);
      } else {
        for (var k = 0; k < run.length - 1; k++) {
          tokens.push(run.slice(k, k + 2));
        }
      }
      i = j;
    } else if (isWord(ch)) {
      var j2 = i;
      while (j2 < n && isWord(s[j2])) j2++;
      tokens.push(s.slice(i, j2));
      i = j2;
    } else {
      i++;
    }
  }
  return tokens;
}

  module.exports = { bigramTokenize: bigramTokenize };
}

    async function readJsonBlock(id) {
      var el = document.getElementById(id);
      if (!el) return null;
      return JSON.parse(el.textContent);
    }

    async function decryptPng(id) {
      if (ENCRYPTED) {
        // enc_payload.encrypt_text() で base64 PNG 文字列を暗号化しているので、
        // 復号結果（UTF-8 文字列）はそのまま <img src="data:image/png;base64,..."> で使える。
        return await decryptBlock(id);
      } else {
        var p = await readJsonBlock(id);
        return p ? p.ct : null;
      }
    }

    async function decryptMeta() {
      if (ENCRYPTED) {
        var s = await decryptBlock('enc-portal-meta');
        return s ? JSON.parse(s) : [];
      } else {
        var p = await readJsonBlock('enc-portal-meta');
        if (!p) return [];
        // 平文モードでは ct が直接 JSON 文字列
        try { return JSON.parse(p.ct); } catch (e) { return []; }
      }
    }

    async function renderThumbs(meta) {
      for (var i = 0; i < meta.length; i++) {
        var entry = meta[i];
        var b64 = await decryptPng('enc-thumb-' + i);
        var img = document.querySelector('img[data-idx="' + i + '"]');
        if (img && b64) img.src = decodePngDataUrl(b64);
        var issueEl = document.querySelector('[data-issue="' + i + '"]');
        if (issueEl) issueEl.textContent = entry.issue || '';
        var dateEl = document.querySelector('[data-date="' + i + '"]');
        if (dateEl) dateEl.textContent = entry.issueDate || '';
        var a = document.querySelector('.thumb-cell[data-idx="' + i + '"] a');
        if (a) a.setAttribute('href', entry.url || '#');
      }
    }

    async function fetchIndex() {
      try {
        var resp = await fetch(INDEX_URL, {cache: 'no-store'});
        if (!resp.ok) return [];
        var payload = await resp.json();
        if (ENCRYPTED) {
          var pt = await decryptBytesRaw(payload.iv, payload.ct);
          var txt = new TextDecoder().decode(pt);
          return JSON.parse(txt);
        }
        // 平文モード
        return payload;
      } catch (e) {
        console.error('index fetch failed', e);
        return [];
      }
    }

    var _mini = null;
    var _records = [];

    async function buildIndex() {
      if (typeof MiniSearch === 'undefined') return;
      _records = await fetchIndex();
      if (!_records.length) return;
      _mini = new MiniSearch({
        fields: ['title', 'text'],
        storeFields: ['issue','issueDate','page','title','text','url'],
        tokenize: bigramTokenize,
        processTerm: function(t){ return t; },
        searchOptions: { combineWith: 'AND', prefix: false, fuzzy: false },
        idField: 'url'
      });
      _mini.addAll(_records.map(function(r, idx) {
        return Object.assign({id: idx}, r);
      }));
    }

    function excerpt(text, q) {
      if (!text) return '';
      if (q && q.length >= 2) {
        var i = text.indexOf(q);
        if (i >= 0) {
          var s = Math.max(0, i - 40);
          var e = Math.min(text.length, i + q.length + 40);
          return (s > 0 ? '…' : '') + text.slice(s, e) + (e < text.length ? '…' : '');
        }
      }
      return text.slice(0, 80) + (text.length > 80 ? '…' : '');
    }

    function runSearch() {
      var q = document.getElementById('search-input').value.trim();
      var box = document.getElementById('search-results');
      box.innerHTML = '';
      if (!q) return;
      if (q.length < 2) {
        box.innerHTML = '<div class="hit">2 文字以上を入力してください</div>';
        return;
      }
      if (!_mini) return;
      var hits = _mini.search(q).slice(0, 20);
      for (var i = 0; i < hits.length; i++) {
        var h = hits[i];
        var d = document.createElement('div');
        d.className = 'hit';
        var a = document.createElement('a');
        a.href = h.url;
        a.textContent = (h.issue || '') + '  p' + (h.page || '') + '  ' + (h.title || '');
        d.appendChild(a);
        var ex = document.createElement('div');
        ex.className = 'excerpt';
        ex.textContent = excerpt(h.text, q);
        d.appendChild(ex);
        box.appendChild(d);
      }
      if (hits.length === 0) {
        box.innerHTML = '<div class="hit">該当なし</div>';
      }
    }

    function wireSearch() {
      var inp = document.getElementById('search-input');
      if (!inp) return;
      inp.addEventListener('input', runSearch);
    }

    async function renderAfterAuth(email) {
      hideGate();
      try { cacheAuth(email || 'cached'); } catch (e) {}
      try {
        var meta = await decryptMeta();
        await renderThumbs(meta);
        await buildIndex();
        wireSearch();
      } catch (e) {
        var err = document.getElementById('auth-error');
        if (err) {
          err.textContent = 'コンテンツの復号に失敗しました。';
          err.style.display='block';
        }
      }
    }

    function parseJwt(token){
      var base64=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
      var json=decodeURIComponent(atob(base64).split('').map(function(c){
        return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(json);
    }
    window.handleCredentialResponse = function(response){
      var err = document.getElementById('auth-error');
      try {
        var payload = parseJwt(response.credential);
        var email = payload.email || '';
        var hd = payload.hd || (email.split('@')[1] || '');
        var verified = payload.email_verified === true || payload.email_verified === 'true';
        if (hd === ALLOWED_DOMAIN && verified) {
          renderAfterAuth(email);
        } else {
          err.textContent = 'アクセスが拒否されました。' + (email || 'このアカウント') +
                           ' は ' + ALLOWED_DOMAIN + ' のアカウントではありません。';
          err.style.display = 'block';
          if (window.google && window.google.accounts && window.google.accounts.id) {
            window.google.accounts.id.disableAutoSelect();
          }
        }
      } catch (e) {
        err.textContent = 'サインインを確認できませんでした。';
        err.style.display = 'block';
      }
    };
    document.addEventListener('DOMContentLoaded', function() {
      var cached = authCached();
      if (cached) renderAfterAuth(cached.email);
    });
  })();
  </script>
